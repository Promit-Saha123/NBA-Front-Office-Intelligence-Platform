<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA Predictor Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
  <style>
    /* ── Design tokens ────────────────────────────── */
    :root {
      --bg: #0a0a0f;
      --bg-card: #13131a;
      --bg-card2: #1a1a24;
      --border: rgba(255,255,255,0.08);
      --border-accent: rgba(99,102,241,0.4);
      --text: #f0f0f8;
      --muted: #8888aa;
      --accent: #6366f1;
      --accent-dim: rgba(99,102,241,0.15);
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --amber: #f59e0b;
      --amber-dim: rgba(245,158,11,0.12);
      --font: 'DM Mono', 'Courier New', monospace;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Header ──────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 0.5px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo h1 {
      font-family: var(--font);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      margin-left: 4px;
    }

    .header-date {
      font-family: var(--font);
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Stat cards ──────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }

    .stat-label {
      font-size: 11px;
      font-family: var(--font);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-family: var(--font);
      font-weight: 500;
      line-height: 1;
    }

    .stat-value.green { color: var(--green); }
    .stat-value.accent { color: var(--accent); }

    .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Section headers ─────────────────────────── */
    .section-header {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    /* ── Game cards ──────────────────────────────── */
    .games-section { margin-bottom: 32px; }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .game-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .game-card:hover::before { opacity: 1; }

    .game-time {
      font-family: var(--font);
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .matchup {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .team-abbr {
      font-family: var(--font);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -1px;
    }

    .team-name {
      font-size: 10px;
      color: var(--muted);
    }

    .team.predicted .team-abbr { color: var(--accent); }

    .vs {
      font-family: var(--font);
      font-size: 12px;
      color: var(--muted);
    }

    .prob-bar-container {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-bottom: 10px;
    }

    .prob-label {
      font-family: var(--font);
      font-size: 10px;
      color: var(--muted);
      width: 30px;
    }

    .prob-label.right { text-align: right; }

    .prob-bar {
      flex: 1;
      height: 4px;
      background: var(--bg-card2);
      border-radius: 2px;
      overflow: hidden;
      display: flex;
    }

    .prob-fill-left {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .prob-fill-right {
      height: 100%;
      background: var(--bg-card2);
    }

    .confidence-badge {
      display: inline-block;
      font-family: var(--font);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .confidence-badge.High {
      background: var(--green-dim);
      color: var(--green);
    }
    .confidence-badge.Medium {
      background: var(--amber-dim);
      color: var(--amber);
    }
    .confidence-badge.Low {
      background: var(--bg-card2);
      color: var(--muted);
    }

    /* ── Chart section ───────────────────────────── */
    .chart-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .chart-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .chart-title {
      font-family: var(--font);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ── Accuracy chart (CSS bars) ───────────────── */
    .accuracy-chart {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .acc-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .acc-month {
      font-family: var(--font);
      font-size: 11px;
      color: var(--muted);
      width: 28px;
    }

    .acc-bar-bg {
      flex: 1;
      height: 6px;
      background: var(--bg-card2);
      border-radius: 3px;
      overflow: hidden;
    }

    .acc-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      border-radius: 3px;
    }

    .acc-pct {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text);
      width: 34px;
      text-align: right;
    }

    /* ── Feature importance ──────────────────────── */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feature-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feature-name {
      font-family: var(--font);
      font-size: 11px;
      color: var(--muted);
      width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feature-bar-bg {
      flex: 1;
      height: 6px;
      background: var(--bg-card2);
      border-radius: 3px;
      overflow: hidden;
    }

    .feature-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 3px;
    }

    .feature-pct {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text);
      width: 34px;
      text-align: right;
    }

    /* ── Live dot ────────────────────────────────── */
    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font);
      font-size: 10px;
      color: var(--green);
    }

    .live-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 700px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .games-grid { grid-template-columns: 1fr; }
      .chart-section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🏀</div>
      <div>
        <h1>nba_predictor<span>v1.0</span></h1>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="live-dot">model active</span>
      <span class="header-date" id="today-date"></span>
    </div>
  </header>

  <!-- Stat cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Season accuracy</div>
      <div class="stat-value green">67.4%</div>
      <div class="stat-sub">vs Vegas 66.8%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Games predicted</div>
      <div class="stat-value accent">1,082</div>
      <div class="stat-sub">this season</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">High confidence</div>
      <div class="stat-value green">74.1%</div>
      <div class="stat-sub">when prob ≥ 65%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Today's games</div>
      <div class="stat-value accent" id="game-count">6</div>
      <div class="stat-sub">predictions ready</div>
    </div>
  </div>

  <!-- Today's Games -->
  <div class="games-section">
    <div class="section-header">Tonight's predictions</div>
    <div class="games-grid" id="games-grid"></div>
  </div>

  <!-- Charts -->
  <div class="chart-section">
    <div class="chart-card">
      <div class="chart-title">Monthly accuracy</div>
      <div class="accuracy-chart" id="accuracy-chart"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Feature importance</div>
      <div class="feature-list" id="feature-list"></div>
    </div>
  </div>

  <script>
    // ── Date ─────────────────────────────────────
    const now = new Date();
    document.getElementById('today-date').textContent =
      now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });

    // ── Mock game data (replace with /predictions/today API call) ─────────
    const games = [
      { home:'BOS', homeFull:'Celtics', away:'MIA', awayFull:'Heat', time:'7:30 PM ET', homeProb:0.71, confidence:'High' },
      { home:'LAL', homeFull:'Lakers', away:'GSW', awayFull:'Warriors', time:'10:00 PM ET', homeProb:0.48, confidence:'Medium' },
      { home:'PHX', homeFull:'Suns', away:'DEN', awayFull:'Nuggets', time:'9:00 PM ET', homeProb:0.44, confidence:'Medium' },
      { home:'NYK', homeFull:'Knicks', away:'ATL', awayFull:'Hawks', time:'7:30 PM ET', homeProb:0.66, confidence:'High' },
      { home:'MIL', homeFull:'Bucks', away:'CLE', awayFull:'Cavaliers', time:'8:00 PM ET', homeProb:0.58, confidence:'Medium' },
      { home:'SAC', homeFull:'Kings', away:'POR', awayFull:'Blazers', time:'10:00 PM ET', homeProb:0.74, confidence:'High' },
    ];

    const gamesGrid = document.getElementById('games-grid');
    document.getElementById('game-count').textContent = games.length;

    games.forEach(g => {
      const winner = g.homeProb >= 0.5 ? g.home : g.away;
      const homeWin = g.homeProb >= 0.5;
      const pct = Math.round(g.homeProb * 100);

      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <div class="game-time">${g.time}</div>
        <div class="matchup">
          <div class="team ${homeWin ? 'predicted' : ''}">
            <div class="team-abbr">${g.home}</div>
            <div class="team-name">${g.homeFull} · home</div>
          </div>
          <div class="vs">vs</div>
          <div class="team ${!homeWin ? 'predicted' : ''}">
            <div class="team-abbr">${g.away}</div>
            <div class="team-name">${g.awayFull} · away</div>
          </div>
        </div>
        <div class="prob-bar-container">
          <span class="prob-label">${pct}%</span>
          <div class="prob-bar">
            <div class="prob-fill-left" style="width:${pct}%"></div>
          </div>
          <span class="prob-label right">${100 - pct}%</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
          <span style="font-size:11px;font-family:var(--font);color:var(--muted);">
            pick: <span style="color:var(--accent)">${winner}</span>
          </span>
          <span class="confidence-badge ${g.confidence}">${g.confidence}</span>
        </div>
      `;
      gamesGrid.appendChild(card);
    });

    // ── Monthly accuracy bars ─────────────────────
    const months = [
      { m:'Oct', acc: 0.641 },
      { m:'Nov', acc: 0.668 },
      { m:'Dec', acc: 0.672 },
      { m:'Jan', acc: 0.681 },
      { m:'Feb', acc: 0.670 },
      { m:'Mar', acc: 0.674 },
      { m:'Apr', acc: 0.690 },
    ];

    const accChart = document.getElementById('accuracy-chart');
    months.forEach(({ m, acc }) => {
      const pct = Math.round(acc * 100);
      const row = document.createElement('div');
      row.className = 'acc-row';
      row.innerHTML = `
        <span class="acc-month">${m}</span>
        <div class="acc-bar-bg"><div class="acc-bar-fill" style="width:${(acc / 0.75 * 100).toFixed(1)}%"></div></div>
        <span class="acc-pct">${pct}%</span>
      `;
      accChart.appendChild(row);
    });

    // ── Feature importance bars ───────────────────
    const features = [
      { name: 'pts_roll10_home', importance: 0.18 },
      { name: 'plus_minus_roll5', importance: 0.15 },
      { name: 'fg_pct_roll10', importance: 0.13 },
      { name: 'rest_days_home', importance: 0.11 },
      { name: 'pts_roll5_away', importance: 0.10 },
      { name: 'ast_roll10_home', importance: 0.09 },
      { name: 'tov_roll5_away', importance: 0.08 },
    ];

    const maxImp = Math.max(...features.map(f => f.importance));
    const featureList = document.getElementById('feature-list');
    features.forEach(({ name, importance }) => {
      const pct = Math.round(importance * 100);
      const row = document.createElement('div');
      row.className = 'feature-row';
      row.innerHTML = `
        <span class="feature-name" title="${name}">${name}</span>
        <div class="feature-bar-bg"><div class="feature-bar-fill" style="width:${(importance / maxImp * 100).toFixed(1)}%"></div></div>
        <span class="feature-pct">${pct}%</span>
      `;
      featureList.appendChild(row);
    });
  </script>
</body>
</html>
